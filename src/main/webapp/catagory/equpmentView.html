<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment Categories</title>
    <!-- Security Meta Tags -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com;">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="no-referrer">
    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../src/style.css">
</head>
<body class="bg-gray-100">

    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-8">Equipment Categories</h1>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Category Card 1 -->
            <div class="bg-white rounded-lg shadow-md hover:shadow-xl transition duration-300">
                <img src="https://via.placeholder.com/300x200" alt="Construction Equipment" class="w-full h-48 object-cover rounded-t-lg">
                <div class="p-4">
                    <h2 class="text-xl font-semibold text-gray-800 mb-2">Construction Equipment</h2>
                    <p class="text-gray-600 mb-4">Heavy machinery and tools for construction projects</p>
                    <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">View Details</button>
                </div>
            </div>

            <!-- Category Card 2 -->
            <div class="bg-white rounded-lg shadow-md hover:shadow-xl transition duration-300">
                <img src="https://via.placeholder.com/300x200" alt="Agricultural Equipment" class="w-full h-48 object-cover rounded-t-lg">
                <div class="p-4">
                    <h2 class="text-xl font-semibold text-gray-800 mb-2">Agricultural Equipment</h2>
                    <p class="text-gray-600 mb-4">Farming and agricultural machinery</p>
                    <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">View Details</button>
                </div>
            </div>

            <!-- Category Card 3 -->
            <div class="bg-white rounded-lg shadow-md hover:shadow-xl transition duration-300">
                <img src="https://via.placeholder.com/300x200" alt="Industrial Equipment" class="w-full h-48 object-cover rounded-t-lg">
                <div class="p-4">
                    <h2 class="text-xl font-semibold text-gray-800 mb-2">Industrial Equipment</h2>
                    <p class="text-gray-600 mb-4">Manufacturing and industrial machinery</p>
                    <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">View Details</button>
                </div>
            </div>

            <!-- Category Card 4 -->
            <div class="bg-white rounded-lg shadow-md hover:shadow-xl transition duration-300">
                <img src="https://via.placeholder.com/300x200" alt="Medical Equipment" class="w-full h-48 object-cover rounded-t-lg">
                <div class="p-4">
                    <h2 class="text-xl font-semibold text-gray-800 mb-2">Medical Equipment</h2>
                    <p class="text-gray-600 mb-4">Healthcare and medical devices</p>
                    <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">View Details</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
