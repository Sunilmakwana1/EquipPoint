<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction Equipment Catalog</title>
    <link rel="stylesheet" href="../src/style.css">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-8">Construction Equipment</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Equipment Card 1 -->
            <div class="bg-white rounded-lg shadow-lg overflow-hidden">
                <img src="../assets/images/excavator.jpg" alt="Excavator" class="w-full h-48 object-cover">
                <div class="p-6">
                    <h2 class="text-xl font-semibold text-gray-800 mb-2">Excavator</h2>
                    <p class="text-gray-600 mb-4">Heavy-duty excavator for construction projects</p>
                    <div class="flex justify-between items-center">
                        <span class="text-2xl font-bold text-blue-600">₹2500/day</span>
                        <button class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-full transition duration-300">Rent Now</button>
                    </div>
                </div>
            </div>

            <!-- Equipment Card 2 -->
            <div class="bg-white rounded-lg shadow-lg overflow-hidden">
                <img src="../assets/images/bulldozer.jpg" alt="Bulldozer" class="w-full h-48 object-cover">
                <div class="p-6">
                    <h2 class="text-xl font-semibold text-gray-800 mb-2">Bulldozer</h2>
                    <p class="text-gray-600 mb-4">Powerful bulldozer for earthmoving operations</p>
                    <div class="flex justify-between items-center">
                        <span class="text-2xl font-bold text-blue-600">₹3000/day</span>
                        <button class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-full transition duration-300">Rent Now</button>
                    </div>
                </div>
            </div>

            <!-- Equipment Card 3 -->
            <div class="bg-white rounded-lg shadow-lg overflow-hidden">
                <img src="../assets/images/crane.jpg" alt="Crane" class="w-full h-48 object-cover">
                <div class="p-6">
                    <h2 class="text-xl font-semibold text-gray-800 mb-2">Crane</h2>
                    <p class="text-gray-600 mb-4">Mobile crane for heavy lifting tasks</p>
                    <div class="flex justify-between items-center">
                        <span class="text-2xl font-bold text-blue-600">₹4000/day</span>
                        <button class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-full transition duration-300">Rent Now</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
