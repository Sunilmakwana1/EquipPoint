<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice PDF</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-10">
    <div class="max-w-3xl mx-auto bg-white p-8 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold mb-4">Invoice</h1>
        <div class="mb-6">
            <p><strong>Invoice Number:</strong> 123456</p>
            <p><strong>Transaction ID:</strong> ABCD1234</p>
        </div>
        <div class="mb-6">
            <h2 class="text-xl font-semibold mb-2">Vehicle Details</h2>
            <p><strong>Model:</strong> Mahindra 575 DI</p>
            <p><strong>Manufacturing Year:</strong> 2025</p>
            <p><strong>Operating Weight:</strong> 1600.0 kg</p>
            <p><strong>Engine Power:</strong> 450.0 HP</p>
            <p><strong>Fuel Type:</strong> Diesel</p>
        </div>
        <div class="mb-6">
            <h2 class="text-xl font-semibold mb-2">Payment Details</h2>
            <p><strong>Total Amount Paid:</strong> $XXXX.XX</p>
            <p><strong>Payment Date:</strong> MM/DD/YYYY</p>
        </div>
    </div>
</body>
</html>
