<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Stock</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto mt-10">
        <h1 class="text-3xl font-bold mb-5 text-center">Stock Information</h1>
        <div class="bg-white shadow-md rounded-lg overflow-hidden mb-10">
            <table class="min-w-full bg-white">
                <thead class="bg-gray-800 text-white">
                    <tr>
                        <th class="w-1/3 py-3 px-4 uppercase font-semibold text-sm">Model</th>
                        <th class="w-1/3 py-3 px-4 uppercase font-semibold text-sm">Manufacturing Year</th>
                        <th class="w-1/3 py-3 px-4 uppercase font-semibold text-sm">Availability</th>
                        <th class="w-1/3 py-3 px-4 uppercase font-semibold text-sm">Tyre Type</th>
                        <th class="w-1/3 py-3 px-4 uppercase font-semibold text-sm">Total Stock</th>
                        <th class="w-1/3 py-3 px-4 uppercase font-semibold text-sm">Action</th>
                    </tr>
                </thead>
                <tbody class="text-gray-700">
                    <tr>
                        <td class="w-1/3 py-3 px-4">Mahindra 575 DI</td>
                        <td class="w-1/3 py-3 px-4">2025</td>
                        <td class="w-1/3 py-3 px-4">Available</td>
                        <td class="w-1/3 py-3 px-4">Heavy Duty</td>
                        <td class="w-1/3 py-3 px-4">10</td>
                        <td class="w-1/3 py-3 px-4">
                            <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="button">
                                Add Stock
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
