<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment Booking</title>
    <link rel="stylesheet" href="../src/style.css">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Equipment Booking</h1>
            <p class="text-gray-600">Select equipment and schedule your booking</p>
        </div>

        <!-- Booking Form -->
        <div class="bg-white rounded-lg shadow-lg p-6">
            <form class="space-y-6">
                <!-- Equipment Name not editable -->
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="equipmentName">
                        Equipment Name
                    </label>
                    <input type="text" id="equipmentName" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" value="JCB 3DX Backhoe Loader" disabled>
                </div>

                <!-- Date -->
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="date">
                        Date
                    </label>
                    <input type="date" id="date" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Duration to days -->
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="duration">
                        Duration (in days)
                    </label>
                    <input type="number" id="duration" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Purpose -->
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="purpose">
                        Purpose of Booking
                    </label>
                    <textarea id="purpose" rows="3" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <!-- total cost on left side -->
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="totalCost">
                        Total Cost
                    </label>
                    <input type="text" id="totalCost" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" disabled>
                </div>

                <!-- Submit Button -->
                <div>
                    <button type="submit" class="w-full bg-blue-500 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-600 transition duration-300">
                        Book Equipment
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
